services:
  console:
    build: .
    ports:
      - "127.0.0.1:${ONTOBRIDGE_PORT:-8787}:8787"
    environment:
      ONTOBRIDGE_DEMO: "0"
      ONTOBRIDGE_TOKENS: ${ONTOBRIDGE_TOKENS:?Run python3 scripts/create_local_env.py first}
      ONTOBRIDGE_DATABASE_URL: postgresql+psycopg://ontobridge:${POSTGRES_PASSWORD}@postgres:5432/ontobridge
      ONTOBRIDGE_TIMEZONE: Asia/Shanghai
    volumes:
      - gateway-data:/data
      - ${ONTOBRIDGE_IMPORTS:-./imports}:/data/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ontobridge
      POSTGRES_DB: ontobridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local environment file first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontobridge -d ontobridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  gateway-data:
  postgres-data:
