services:
  console:
    build: .
    image: ontobridge-platform:local
    ports:
      - "127.0.0.1:${ONTOBRIDGE_PORT:-8787}:8787"
    environment:
      ONTOBRIDGE_DEMO: "0"
      ONTOBRIDGE_TOKENS: ${ONTOBRIDGE_TOKENS:?Run python3 scripts/create_local_env.py first}
      ONTOBRIDGE_DATABASE_URL: postgresql+psycopg://ontobridge:${POSTGRES_PASSWORD}@postgres:5432/ontobridge
      ONTOBRIDGE_TIMEZONE: Asia/Shanghai
      ONTOBRIDGE_CONNECTIONS_FILE: /run/ontobridge/connections.json
      ONTOBRIDGE_LLM_CONFIG: ${ONTOBRIDGE_LLM_CONFIG:-}
    volumes:
      - gateway-data:/data
      - ${ONTOBRIDGE_CONFIG_DIR:-./config}:/run/ontobridge:ro
      - ${ONTOBRIDGE_IMPORTS:-./imports}:/data/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: ontobridge-platform:local
    command: ["/app/.venv/bin/ontobridge-worker"]
    environment:
      ONTOBRIDGE_DATABASE_URL: postgresql+psycopg://ontobridge:${POSTGRES_PASSWORD}@postgres:5432/ontobridge
      ONTOBRIDGE_TIMEZONE: Asia/Shanghai
      ONTOBRIDGE_CONNECTIONS_FILE: /run/ontobridge/connections.json
    volumes:
      - gateway-data:/data
      - ${ONTOBRIDGE_IMPORTS:-./imports}:/data/sources:ro
      - ${ONTOBRIDGE_CONFIG_DIR:-./config}:/run/ontobridge:ro
    depends_on:
      postgres:
        condition: service_healthy
      console:
        condition: service_started
    restart: unless-stopped
  mcp:
    build: ./gateway
    image: ontobridge-mcp:local
    ports:
      - "127.0.0.1:${ONTOBRIDGE_MCP_PORT:-8790}:8790"
    environment:
      ONTOBRIDGE_API_URL: http://console:8787
      ONTOBRIDGE_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp
    depends_on:
      - console
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ontobridge
      POSTGRES_DB: ontobridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local environment file first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontobridge -d ontobridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  gateway-data:
  postgres-data:
